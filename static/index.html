<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PDF to Plan Sheet</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">PLAN SHEET CONVERTER</p>
      <h1>Turn a purchase order PDF into an Excel plan sheet.</h1>
      <p class="intro">Upload a purchase order, choose the Excel filename, then download the completed sheet.</p>

      <form id="convert-form">
        <label class="dropzone" id="dropzone" for="pdf">
          <input id="pdf" name="pdf" type="file" accept="application/pdf,.pdf" required>
          <strong id="file-label">Drop a PDF here or choose a file</strong>
          <span>PDF only · up to 25 MB</span>
        </label>

        <label class="field" for="download-name">
          Download filename
          <input id="download-name" name="download-name" type="text" value="plan_sheet" maxlength="175" required>
          <small>.xlsx is added automatically.</small>
        </label>

        <button id="submit" type="submit">Create Excel sheet</button>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
